name: OpenWrt Builder

on:
  repository_dispatch:
  workflow_dispatch:
permissions:
  contents: write
  actions: write

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  UPLOAD_GOFILE: false
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
        TZ: Asia/Shanghai
      shell: bash
      run: |
        set -Eeuo pipefail
        export DEBIAN_FRONTEND=noninteractive
        export TZ="${TZ:-Asia/Shanghai}"
    
        log() { echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] $*"; }
    
        # 心跳输出：避免长时间无日志被误判卡死
        (
          while true; do
            log "heartbeat: initialization still running..."
            sleep 30
          done
        ) &
        HB_PID=$!
        cleanup() {
          set +e
          kill "$HB_PID" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT
    
        log "free disk space: remove preinstalled SDK/tool caches"
        sudo rm -rf \
          /etc/apt/sources.list.d/* \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/ghc \
          /opt/hostedtoolcache/CodeQL
    
        log "docker image prune"
        timeout 20m sudo docker image prune --all --force || true
    
        log "apt update"
        timeout 10m sudo -E apt-get update
    
        log "apt install build dependencies"
        timeout 40m sudo -E apt-get install -y \
          ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl \
          device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool \
          libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
          libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp \
          ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync \
          scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
    
        log "autoremove purge (bounded)"
        timeout 20m sudo -E apt-get autoremove --purge -y || true
    
        log "apt clean"
        sudo -E apt-get clean || true
    
        log "dpkg/apt recovery safeguard"
        sudo dpkg --configure -a || true
        sudo apt-get -f install -y || true
    
        log "set timezone"
        sudo timedatectl set-timezone "${TZ}" || true
    
        log "prepare workdir"
        sudo mkdir -p /workdir
        sudo chown "$USER":"$(id -gn)" /workdir
    
        log "initialization done"
    
        - name: Clone source code
          working-directory: /workdir
          run: |
            df -hT $PWD
            git clone $REPO_URL -b $REPO_BRANCH openwrt
            ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Restore dl/ccache cache
      uses: actions/cache@v4
      with:
        path: |
          openwrt/dl
          openwrt/.ccache
        key: ${{ runner.os }}-openwrt-${{ env.REPO_BRANCH }}-${{ hashFiles('openwrt/.config') }}
        restore-keys: |
          ${{ runner.os }}-openwrt-${{ env.REPO_BRANCH }}-
          ${{ runner.os }}-openwrt-
          
    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH
    - name: Enable ccache
      run: |
        cd openwrt
        grep -q '^CONFIG_CCACHE=y' .config || echo 'CONFIG_CCACHE=y' >> .config
        make defconfig
        
    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Install Clang/LLVM 14
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-14 llvm-14 lld-14

    - name: Export LLVM 14 env
      run: |
        echo "/usr/lib/llvm-14/bin" >> "$GITHUB_PATH"
        echo "CC=clang-14" >> "$GITHUB_ENV"
        echo "CXX=clang++-14" >> "$GITHUB_ENV"
        echo "LLVM=1" >> "$GITHUB_ENV"

    - name: Verify clang toolchain
      run: |
        set -euo pipefail
        export PATH=/usr/lib/llvm-14/bin:$PATH
        command -v clang
        clang --version
        clang -dumpversion
        command -v clang-14
        clang-14 --version
        CLANG_MAJOR="$(clang-14 -dumpversion | cut -d. -f1)"
        test -n "$CLANG_MAJOR"
        test "$CLANG_MAJOR" -ge 12

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        hash -r
        export PATH=/usr/lib/llvm-14/bin:$PATH
        export CC=clang-14
        export CXX=clang++-14
        export LLVM=1
        echo -e "$(nproc) thread compile"
        make -j"$(nproc)" CC=clang-14 CXX=clang++-14 LLVM=1 || make -j1 CC=clang-14 CXX=clang++-14 LLVM=1 || make -j1 V=s CC=clang-14 CXX=clang++-14 LLVM=1
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt

        if [ "${UPLOAD_GOFILE}" = "true" ]; then
          echo "🔗 [GoFile](${{ steps.gofile.outputs.url }})" >> release.txt
        fi
        
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 2

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
